name: Stage-1 reference

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the reference and open-source solver
        run: python -m pip install -e .
      - name: Run the Stage-1 regression
        run: python -m unittest discover -s tests -q
      - name: Run the public API example
        run: python examples/stage1_quickstart.py
      - name: Run the bounded benchmark
        run: python scripts/run_synthetic_benchmark.py --config configs/synthetic_benchmark_smoke.json --output results/ci-benchmark
      - name: Recompute the recorded backend comparison
        run: python scripts/compare_synthetic_benchmarks.py --reference benchmarks/reference --candidate benchmarks/gurobi --output results/ci-backend-comparison
      - name: Verify the publication manifest
        run: python scripts/prepare_stage1_release.py --check
